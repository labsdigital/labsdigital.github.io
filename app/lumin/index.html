<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Lumin — buat kuis, flashcard, video interaktif, dan konten belajar H5P langsung di peramban. Semua tersimpan di perangkat Anda.">
  <meta name="theme-color" content="#22318F">
  <title>Lumin — Pembuat konten belajar interaktif</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Schibsted+Grotesk:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <a class="skip-link" href="#main">Lewati ke konten utama</a>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Navigasi utama"></aside>
    <div class="scrim" id="scrim"></div>
    <div class="shell">
      <header class="topbar" id="topbar"></header>
      <main id="main" class="main" tabindex="-1"></main>
    </div>
  </div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="modal-root"></div>
  <input type="file" id="import-input" accept=".h5p,.json,.zip,application/json" multiple hidden>

  <script src="js/icons.js"></script>
  <script src="js/player.js"></script>
  <script src="js/types.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/zip.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/exporter.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
