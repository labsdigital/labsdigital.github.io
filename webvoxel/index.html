<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebVoxel - Voxel Editor</title>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Phosphor Icons for UI icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- Three.js Library and add-ons -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/OBJExporter.js"></script>
    <!-- GLTFExporter is required for valid GLB exports that 3D Viewers can read -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/GLTFExporter.js"></script>
    <!-- STLExporter for 3D printing and standard model formats -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/STLExporter.js"></script>

    <style>
        body { margin: 0; overflow: hidden; background-color: #0f172a; }
        #canvas-container { cursor: crosshair; outline: none; }
        
        /* Custom scrollbar for tools */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        /* Toast animation */
        @keyframes slideIn {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .toast-animate { animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
    </style>
</head>
<body class="font-sans text-slate-200 h-screen w-screen flex flex-col md:flex-row overflow-hidden selection:bg-indigo-500/30">

    <!-- Sidebar: Tools & Colors -->
    <aside class="w-full md:w-72 bg-slate-800 border-b md:border-r border-slate-700 flex flex-col z-20 shrink-0 shadow-2xl h-[40vh] md:h-screen">
        <!-- Brand -->
        <div class="p-5 border-b border-slate-700 flex items-center justify-between">
            <h1 class="text-2xl font-bold flex items-center gap-3 tracking-tight">
                <i class="ph-fill ph-cube text-indigo-500 text-3xl"></i>
                WebVoxel
            </h1>
        </div>

        <!-- Scrollable Content Area -->
        <div class="flex-1 overflow-y-auto flex flex-col">
            <!-- Tools Section -->
            <div class="p-5 border-b border-slate-700">
                <h2 class="text-xs font-bold text-slate-400 mb-4 uppercase tracking-widest">Tools</h2>
                <div class="flex flex-col gap-2" id="tools-container">
                    <button class="tool-btn active flex items-center gap-3 w-full p-3 rounded-lg bg-indigo-600 text-white font-medium transition-all" data-tool="add">
                        <i class="ph ph-plus-square text-xl"></i> Add Block (A)
                    </button>
                    <button class="tool-btn flex items-center gap-3 w-full p-3 rounded-lg text-slate-300 hover:bg-slate-700 font-medium transition-all" data-tool="erase">
                        <i class="ph ph-eraser text-xl"></i> Erase (E)
                    </button>
                    <button class="tool-btn flex items-center gap-3 w-full p-3 rounded-lg text-slate-300 hover:bg-slate-700 font-medium transition-all" data-tool="paint">
                        <i class="ph ph-paint-brush-broad text-xl"></i> Paint (P)
                    </button>
                </div>
            </div>

            <!-- Colors Section -->
            <div class="p-5 flex-1">
                <h2 class="text-xs font-bold text-slate-400 mb-4 uppercase tracking-widest">Color Palette</h2>
                
                <div class="mb-5 flex items-center gap-3 p-2 bg-slate-900 rounded-lg border border-slate-700">
                    <input type="color" id="color-picker" value="#3b82f6" class="w-10 h-10 rounded cursor-pointer border-0 bg-transparent shrink-0 p-0">
                    <div class="flex-1 text-sm font-mono text-slate-400 uppercase" id="color-hex-display">#3b82f6</div>
                </div>

                <div class="grid grid-cols-5 gap-2" id="color-palette">
                    <!-- Palettes will be generated by JS -->
                </div>
            </div>
        </div>
    </aside>

    <!-- Main Workspace -->
    <main class="flex-1 relative flex flex-col min-h-[60vh] md:h-screen">
        <!-- Top Action Bar -->
        <header class="absolute top-0 left-0 right-0 h-auto md:h-16 bg-slate-800/90 backdrop-blur-md border-b border-slate-700 flex flex-wrap items-center justify-between p-2 md:px-4 z-10 shadow-sm pointer-events-none">
            <div class="hidden lg:flex text-xs text-slate-400 items-center gap-4 bg-slate-900/50 px-3 py-1.5 rounded-full pointer-events-auto">
                <span class="flex items-center gap-1"><i class="ph-fill ph-mouse-left"></i> Action</span>
                <span class="flex items-center gap-1"><i class="ph-fill ph-mouse-right"></i> Orbit</span>
                <span class="flex items-center gap-1">Shift + <i class="ph-fill ph-mouse-right"></i> Pan</span>
                <span class="flex items-center gap-1">Scroll: Zoom</span>
            </div>
            
            <div class="flex items-center gap-1.5 md:gap-2 pointer-events-auto w-full lg:w-auto justify-end flex-wrap">
                <!-- Undo/Redo/Clear -->
                <button id="btn-undo" class="p-2 hover:bg-slate-700 rounded-lg text-slate-400 hover:text-white transition-colors disabled:opacity-30 disabled:cursor-not-allowed" title="Undo (Ctrl+Z)">
                    <i class="ph ph-arrow-u-up-left text-xl"></i>
                </button>
                <button id="btn-redo" class="p-2 hover:bg-slate-700 rounded-lg text-slate-400 hover:text-white transition-colors disabled:opacity-30 disabled:cursor-not-allowed" title="Redo (Ctrl+Y)">
                    <i class="ph ph-arrow-u-up-right text-xl"></i>
                </button>
                <div class="w-px h-6 bg-slate-600 mx-1"></div>
                
                <button id="btn-clear" class="p-2 md:px-4 md:py-2 hover:bg-red-500/20 hover:text-red-400 rounded-lg text-slate-300 transition-colors text-sm font-medium flex items-center gap-2" title="Clear Canvas">
                    <i class="ph ph-trash text-lg"></i> <span class="hidden xl:inline">Clear</span>
                </button>
                <div class="w-px h-6 bg-slate-600 mx-1"></div>

                <!-- Hidden Input for Loading JSON -->
                <input type="file" id="file-import-json" accept=".json" class="hidden">
                
                <!-- JSON Save/Load -->
                <button id="btn-import-json" class="p-2 md:px-4 md:py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-slate-200 transition-colors text-sm font-medium flex items-center gap-2" title="Open Project (JSON)">
                    <i class="ph ph-folder-open text-lg"></i> <span class="hidden sm:inline">Open</span>
                </button>
                <button id="btn-export-json" class="p-2 md:px-4 md:py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-slate-200 transition-colors text-sm font-medium flex items-center gap-2" title="Save Project (JSON)">
                    <i class="ph ph-floppy-disk text-lg"></i> <span class="hidden sm:inline">Save</span>
                </button>
                
                <div class="w-px h-6 bg-slate-600 mx-1 hidden md:block"></div>

                <!-- Export Group -->
                <div class="flex items-center gap-1 bg-slate-900/50 p-1 rounded-lg pointer-events-auto">
                    <span class="text-xs text-slate-400 px-2 hidden lg:inline">Export:</span>
                    <button id="btn-export-glb" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 rounded text-white text-xs font-medium transition-colors" title="Export to GLB">GLB</button>
                    <button id="btn-export-obj" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 rounded text-slate-200 text-xs font-medium transition-colors" title="Export to OBJ">OBJ</button>
                    <button id="btn-export-stl" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 rounded text-slate-200 text-xs font-medium transition-colors" title="Export to STL">STL</button>
                </div>
            </div>
        </header>

        <!-- 3D Canvas -->
        <div id="canvas-container" class="w-full h-full pt-16"></div>

        <!-- Toast Notification Container -->
        <div id="toast-container" class="absolute bottom-6 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-2 pointer-events-none"></div>
    </main>

    <script>
        // --- State Variables ---
        let currentTool = 'add'; // 'add', 'erase', 'paint'
        let currentColor = '#3b82f6';
        let voxels = []; // Array to store all created voxel meshes
        let isPointerDragging = false;
        let pointerDownPos = new THREE.Vector2();

        // History for Undo/Redo
        let history = [];
        let historyIndex = -1;

        // --- Three.js Variables ---
        let camera, scene, renderer, controls;
        let plane, gridHelper;
        let rollOverMesh, rollOverMaterial;
        let raycaster, pointer;
        
        // Arrays for raycasting
        let intersectObjects = []; // Plane + Voxels
        
        // Geometries and Materials cache to improve performance
        const voxelGeometry = new THREE.BoxGeometry( 1, 1, 1 );
        
        // Initialization
        init();
        animate();
        setupUI();

        function init() {
            const container = document.getElementById( 'canvas-container' );

            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color( 0x0f172a ); // Matches Tailwind slate-900

            // Camera
            camera = new THREE.PerspectiveCamera( 45, container.clientWidth / container.clientHeight, 1, 10000 );
            camera.position.set( 20, 20, 20 );
            camera.lookAt( 0, 0, 0 );

            // Roll-over helpers (The transparent block showing where you are pointing)
            const rollOverGeo = new THREE.BoxGeometry( 1.01, 1.01, 1.01 ); // slightly larger to prevent z-fighting
            rollOverMaterial = new THREE.MeshBasicMaterial( { color: 0xffffff, opacity: 0.5, transparent: true, wireframe: true } );
            rollOverMesh = new THREE.Mesh( rollOverGeo, rollOverMaterial );
            scene.add( rollOverMesh );

            // Grid
            gridHelper = new THREE.GridHelper( 32, 32, 0x334155, 0x1e293b );
            scene.add( gridHelper );

            // Base Raycast Plane
            const geometry = new THREE.PlaneGeometry( 32, 32 );
            geometry.rotateX( - Math.PI / 2 );
            plane = new THREE.Mesh( geometry, new THREE.MeshBasicMaterial( { visible: false } ) );
            scene.add( plane );
            intersectObjects.push( plane );

            // Lights
            const ambientLight = new THREE.AmbientLight( 0xffffff, 0.6 );
            scene.add( ambientLight );

            const directionalLight = new THREE.DirectionalLight( 0xffffff, 0.8 );
            directionalLight.position.set( 10, 20, 15 );
            directionalLight.castShadow = true;
            
            // Adjust shadow properties
            directionalLight.shadow.mapSize.width = 2048;
            directionalLight.shadow.mapSize.height = 2048;
            directionalLight.shadow.camera.left = -20;
            directionalLight.shadow.camera.right = 20;
            directionalLight.shadow.camera.top = 20;
            directionalLight.shadow.camera.bottom = -20;
            scene.add( directionalLight );

            // Renderer
            renderer = new THREE.WebGLRenderer( { antialias: true } );
            renderer.setPixelRatio( window.devicePixelRatio );
            renderer.setSize( container.clientWidth, container.clientHeight );
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild( renderer.domElement );

            // Orbit Controls
            controls = new THREE.OrbitControls( camera, renderer.domElement );
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2; // Don't allow camera to go below ground

            // Raycaster
            raycaster = new THREE.Raycaster();
            pointer = new THREE.Vector2();

            // Event Listeners
            container.addEventListener( 'pointermove', onPointerMove );
            container.addEventListener( 'pointerdown', onPointerDown );
            container.addEventListener( 'pointerup', onPointerUp );
            container.addEventListener( 'pointerleave', () => { rollOverMesh.visible = false; } );
            window.addEventListener( 'resize', onWindowResize );
            
            // Keyboard shortcuts
            document.addEventListener( 'keydown', onDocumentKeyDown );
        }

        function onWindowResize() {
            const container = document.getElementById( 'canvas-container' );
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize( container.clientWidth, container.clientHeight );
        }

        function getIntersects( event, container ) {
            // Memperbaiki akurasi pointer dengan menggunakan posisi absolut domElement (canvas)
            const canvas = renderer.domElement;
            const rect = canvas.getBoundingClientRect();
            
            // Calculate mouse position in normalized device coordinates (-1 to +1)
            pointer.x = ( ( event.clientX - rect.left ) / rect.width ) * 2 - 1;
            pointer.y = - ( ( event.clientY - rect.top ) / rect.height ) * 2 + 1;

            raycaster.setFromCamera( pointer, camera );
            return raycaster.intersectObjects( intersectObjects, false );
        }

        function onPointerMove( event ) {
            const container = document.getElementById( 'canvas-container' );
            const intersects = getIntersects( event, container );
            
            // Detect if user is dragging the camera
            if (event.buttons !== 0) {
                const dist = pointerDownPos.distanceTo(new THREE.Vector2(event.clientX, event.clientY));
                if (dist > 5) isPointerDragging = true;
            }

            if ( intersects.length > 0 ) {
                const intersect = intersects[ 0 ];

                if ( currentTool === 'add' ) {
                    // Move roll-over helper to position + scaled normal (push slightly over the edge)
                    rollOverMesh.position.copy( intersect.point ).add( intersect.face.normal.clone().multiplyScalar( 0.1 ) );
                    rollOverMesh.position.floor().addScalar( 0.5 );
                    rollOverMesh.visible = true;
                    // Update material color based on current color
                    rollOverMaterial.color.setHex( parseInt(currentColor.replace('#', '0x')) );
                    rollOverMaterial.wireframe = false;
                    rollOverMaterial.opacity = 0.8;
                } else if ( currentTool === 'erase' || currentTool === 'paint' ) {
                    // Only show hover effect on voxels, not the base plane
                    if ( intersect.object !== plane ) {
                        rollOverMesh.position.copy( intersect.object.position );
                        rollOverMesh.visible = true;
                        if(currentTool === 'erase') {
                            rollOverMaterial.color.setHex( 0xff0000 );
                            rollOverMaterial.wireframe = true;
                            rollOverMaterial.opacity = 0.5;
                        } else {
                            rollOverMaterial.color.setHex( parseInt(currentColor.replace('#', '0x')) );
                            rollOverMaterial.wireframe = true;
                            rollOverMaterial.opacity = 0.8;
                        }
                    } else {
                        rollOverMesh.visible = false;
                    }
                }
            } else {
                rollOverMesh.visible = false;
            }
        }

        function onPointerDown( event ) {
            pointerDownPos.set(event.clientX, event.clientY);
            isPointerDragging = false;
        }

        function onPointerUp( event ) {
            // Prevent action if user was dragging the camera (Orbiting)
            if ( isPointerDragging ) return;
            // Prevent action if right clicking (orbit) or middle clicking (pan)
            if ( event.button !== 0 ) return;

            const container = document.getElementById( 'canvas-container' );
            const intersects = getIntersects( event, container );

            if ( intersects.length > 0 ) {
                const intersect = intersects[ 0 ];

                if ( currentTool === 'add' ) {
                    // Calculate position by pushing slightly along the normal
                    const position = new THREE.Vector3().copy( intersect.point ).add( intersect.face.normal.clone().multiplyScalar( 0.1 ) );
                    position.floor().addScalar( 0.5 );
                    
                    addVoxel(position, currentColor);
                } else if ( currentTool === 'erase' ) {
                    if ( intersect.object !== plane ) {
                        eraseVoxel(intersect.object);
                    }
                } else if ( currentTool === 'paint' ) {
                    if ( intersect.object !== plane ) {
                        paintVoxel(intersect.object, currentColor);
                    }
                }
                
                // Hide rollover momentarily to prevent visual glitch on click
                rollOverMesh.visible = false;
                onPointerMove(event); // Re-calculate hover immediately
            }
        }

        function createVoxelMesh(color) {
            const material = new THREE.MeshLambertMaterial( { color: color } );
            const voxel = new THREE.Mesh( voxelGeometry, material );
            voxel.castShadow = true;
            voxel.receiveShadow = true;
            return voxel;
        }

        function addVoxel(position, colorHex, saveHistory = true) {
            // Check if voxel already exists at this exact position (prevent stacking errors)
            const exists = voxels.some(v => v.position.equals(position));
            if(exists && saveHistory) return;

            const voxel = createVoxelMesh(colorHex);
            voxel.position.copy(position);
            
            scene.add( voxel );
            intersectObjects.push( voxel );
            voxels.push( voxel );

            if (saveHistory) {
                recordHistory({ type: 'add', mesh: voxel, position: position.clone(), color: colorHex });
            }
        }

        function eraseVoxel(mesh, saveHistory = true) {
            scene.remove( mesh );
            intersectObjects.splice( intersectObjects.indexOf( mesh ), 1 );
            voxels.splice( voxels.indexOf( mesh ), 1 );

            if (saveHistory) {
                recordHistory({ type: 'erase', mesh: mesh, position: mesh.position.clone(), color: '#' + mesh.material.color.getHexString() });
            }
        }

        function paintVoxel(mesh, newColorHex, saveHistory = true) {
            const oldColorHex = '#' + mesh.material.color.getHexString();
            // Don't paint if it's the same color
            if (oldColorHex.toLowerCase() === newColorHex.toLowerCase() && saveHistory) return;

            mesh.material.color.setHex( parseInt(newColorHex.replace('#', '0x')) );

            if (saveHistory) {
                recordHistory({ type: 'paint', mesh: mesh, oldColor: oldColorHex, newColor: newColorHex });
            }
        }

        function clearAll(record = true, showNotification = true) {
            if(voxels.length === 0) return;
            
            const removedMeshes = [...voxels];
            
            // Remove all
            removedMeshes.forEach(mesh => {
                scene.remove(mesh);
            });
            
            // Reset arrays
            voxels = [];
            intersectObjects = [plane]; // Keep plane
            
            if (record) {
                recordHistory({ type: 'clear', meshes: removedMeshes });
            }
            if (showNotification) {
                showToast("Workspace cleared", "info");
            }
        }

        function recordHistory(action) {
            // If we are currently back in history, remove future timelines
            if (historyIndex < history.length - 1) {
                history = history.slice(0, historyIndex + 1);
            }
            
            history.push(action);
            // Limit history to 50 steps
            if (history.length > 50) history.shift();
            else historyIndex++;
            
            updateUndoRedoUI();
        }

        function undo() {
            if (historyIndex < 0) return;
            const action = history[historyIndex];

            switch(action.type) {
                case 'add':
                    eraseVoxel(action.mesh, false);
                    break;
                case 'erase':
                    // Re-add
                    scene.add(action.mesh);
                    intersectObjects.push(action.mesh);
                    voxels.push(action.mesh);
                    break;
                case 'paint':
                    paintVoxel(action.mesh, action.oldColor, false);
                    break;
                case 'clear':
                    // Re-add all
                    action.meshes.forEach(mesh => {
                        scene.add(mesh);
                        intersectObjects.push(mesh);
                        voxels.push(mesh);
                    });
                    break;
            }
            historyIndex--;
            updateUndoRedoUI();
        }

        function redo() {
            if (historyIndex >= history.length - 1) return;
            historyIndex++;
            const action = history[historyIndex];

            switch(action.type) {
                case 'add':
                    // Re-add
                    scene.add(action.mesh);
                    intersectObjects.push(action.mesh);
                    voxels.push(action.mesh);
                    break;
                case 'erase':
                    eraseVoxel(action.mesh, false);
                    break;
                case 'paint':
                    paintVoxel(action.mesh, action.newColor, false);
                    break;
                case 'clear':
                    action.meshes.forEach(mesh => {
                        scene.remove(mesh);
                    });
                    voxels = [];
                    intersectObjects = [plane];
                    break;
            }
            updateUndoRedoUI();
        }

        function setupUI() {
            // Tool Buttons
            const toolBtns = document.querySelectorAll('.tool-btn');
            toolBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    // Remove active state from all
                    toolBtns.forEach(b => {
                        b.classList.remove('bg-indigo-600', 'text-white');
                        b.classList.add('text-slate-300', 'hover:bg-slate-700');
                    });
                    // Add active state
                    btn.classList.add('bg-indigo-600', 'text-white');
                    btn.classList.remove('text-slate-300', 'hover:bg-slate-700');
                    
                    currentTool = btn.dataset.tool;
                    rollOverMesh.visible = false; // reset hover display
                });
            });

            // Color Palette Generator
            const colors = [
                '#ef4444', '#f97316', '#f59e0b', '#eab308', '#84cc16', 
                '#22c55e', '#10b981', '#14b8a6', '#06b6d4', '#0ea5e9',
                '#3b82f6', '#6366f1', '#8b5cf6', '#a855f7', '#d946ef',
                '#ec4899', '#f43f5e', '#ffffff', '#94a3b8', '#000000'
            ];
            
            const paletteContainer = document.getElementById('color-palette');
            const colorPicker = document.getElementById('color-picker');
            const colorHexDisplay = document.getElementById('color-hex-display');

            colors.forEach(color => {
                const swatch = document.createElement('div');
                swatch.className = 'w-full aspect-square rounded-md cursor-pointer hover:scale-110 transition-transform border border-slate-700/50 shadow-sm';
                swatch.style.backgroundColor = color;
                swatch.addEventListener('click', () => {
                    setColor(color);
                });
                paletteContainer.appendChild(swatch);
            });

            colorPicker.addEventListener('input', (e) => {
                setColor(e.target.value);
            });

            function setColor(hex) {
                currentColor = hex;
                colorPicker.value = hex;
                colorHexDisplay.innerText = hex;
                
                // Automatically switch to add or paint tool if erase is selected
                if(currentTool === 'erase') {
                    document.querySelector('.tool-btn[data-tool="add"]').click();
                }
            }

            // Action Buttons
            document.getElementById('btn-clear').addEventListener('click', () => {
                // Ensure a custom confirm is utilized using prompt/confirm for simplicity 
                // Alternatively a custom modal but standard confirm suffices.
                if(window.confirm("Are you sure you want to clear the entire workspace?")) {
                    clearAll(true, true);
                }
            });

            document.getElementById('btn-undo').addEventListener('click', undo);
            document.getElementById('btn-redo').addEventListener('click', redo);
            
            // Import / Export Buttons
            document.getElementById('btn-export-json').addEventListener('click', exportToJSON);
            
            document.getElementById('btn-import-json').addEventListener('click', () => {
                document.getElementById('file-import-json').click();
            });
            document.getElementById('file-import-json').addEventListener('change', importFromJSON);

            document.getElementById('btn-export-glb').addEventListener('click', exportToGLB);
            document.getElementById('btn-export-obj').addEventListener('click', exportToOBJ);
            document.getElementById('btn-export-stl').addEventListener('click', exportToSTL);

            updateUndoRedoUI();
        }

        function updateUndoRedoUI() {
            const btnUndo = document.getElementById('btn-undo');
            const btnRedo = document.getElementById('btn-redo');
            
            btnUndo.disabled = historyIndex < 0;
            btnRedo.disabled = historyIndex >= history.length - 1;
        }

        // Keyboard shortcuts mapping
        function onDocumentKeyDown( event ) {
            if ( event.target.tagName.toLowerCase() === 'input' ) return;

            switch ( event.key.toLowerCase() ) {
                case 'a': document.querySelector('.tool-btn[data-tool="add"]').click(); break;
                case 'e': document.querySelector('.tool-btn[data-tool="erase"]').click(); break;
                case 'p': document.querySelector('.tool-btn[data-tool="paint"]').click(); break;
                case 'z':
                    if ( event.ctrlKey || event.metaKey ) {
                        if ( event.shiftKey ) redo();
                        else undo();
                    }
                    break;
                case 'y':
                    if ( event.ctrlKey || event.metaKey ) redo();
                    break;
            }
        }

        // --- JSON SAVE AND LOAD ---
        function exportToJSON() {
            if (voxels.length === 0) {
                showToast("Workspace is empty. Nothing to save.", "error");
                return;
            }

            // Extract position and color data from meshes
            const voxelData = voxels.map(v => {
                return {
                    p: { x: v.position.x, y: v.position.y, z: v.position.z },
                    c: '#' + v.material.color.getHexString()
                };
            });

            const jsonString = JSON.stringify(voxelData);
            const blob = new Blob([jsonString], { type: "application/json" });
            const link = document.createElement('a');
            link.style.display = 'none';
            link.href = URL.createObjectURL(blob);
            link.download = 'webvoxel_project.json';
            
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            showToast("Project saved successfully!", "success");
        }

        function importFromJSON(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    
                    if (!Array.isArray(data)) throw new Error("Invalid format");

                    // Clear canvas without recording history and without toast
                    clearAll(false, false);
                    
                    // Reconstruct Voxels
                    data.forEach(item => {
                        if (item.p && item.c) {
                            const pos = new THREE.Vector3(item.p.x, item.p.y, item.p.z);
                            addVoxel(pos, item.c, false); // false = don't record to history during load
                        }
                    });

                    // Reset undo/redo history for new project
                    history = [];
                    historyIndex = -1;
                    updateUndoRedoUI();

                    showToast("Project loaded successfully!", "success");
                } catch (error) {
                    console.error(error);
                    showToast("Failed to load project file.", "error");
                }
            };
            
            reader.readAsText(file);
            // Reset input value so same file can be chosen again
            event.target.value = '';
        }

        // --- GLB EXPORT (BINARISED GLTF) ---
        function exportToGLB() {
            if (voxels.length === 0) {
                showToast("Workspace is empty. Nothing to export.", "error");
                return;
            }

            try {
                // Ensure GLTFExporter is loaded
                if (typeof THREE.GLTFExporter === 'undefined') {
                    throw new Error("GLTFExporter library is missing.");
                }

                const exporter = new THREE.GLTFExporter();
                
                // Group the voxels to export them as a single scene object
                const exportGroup = new THREE.Group();
                voxels.forEach(voxel => exportGroup.add(voxel.clone()));

                // We request binary: true to export directly as a .glb file
                exporter.parse( exportGroup, function ( glb ) {
                    const blob = new Blob( [ glb ], { type: 'application/octet-stream' } );
                    const link = document.createElement( 'a' );
                    link.style.display = 'none';
                    link.href = URL.createObjectURL( blob );
                    link.download = 'webvoxel_model.glb';
                    
                    document.body.appendChild( link );
                    link.click();
                    document.body.removeChild( link );
                    
                    showToast("Model exported to .GLB successfully!", "success");
                }, { binary: true } );
                
            } catch (error) {
                console.error("Export failed:", error);
                showToast("Failed to export GLB model.", "error");
            }
        }

        // --- OBJ EXPORT ---
        function exportToOBJ() {
            if (voxels.length === 0) {
                showToast("Workspace is empty. Nothing to export.", "error");
                return;
            }

            try {
                if (typeof THREE.OBJExporter === 'undefined') {
                    throw new Error("OBJExporter library is missing.");
                }

                const exporter = new THREE.OBJExporter();
                const exportGroup = new THREE.Group();
                voxels.forEach(voxel => exportGroup.add(voxel.clone()));
                
                const result = exporter.parse( exportGroup );
                
                const blob = new Blob( [ result ], { type: 'text/plain' } );
                const link = document.createElement( 'a' );
                link.style.display = 'none';
                link.href = URL.createObjectURL( blob );
                link.download = 'webvoxel_model.obj';
                
                document.body.appendChild( link );
                link.click();
                document.body.removeChild( link );
                
                showToast("Model exported to .OBJ successfully!", "success");
            } catch (error) {
                console.error("Export failed:", error);
                showToast("Failed to export OBJ model.", "error");
            }
        }

        // --- STL EXPORT ---
        function exportToSTL() {
            if (voxels.length === 0) {
                showToast("Workspace is empty. Nothing to export.", "error");
                return;
            }

            try {
                if (typeof THREE.STLExporter === 'undefined') {
                    throw new Error("STLExporter library is missing.");
                }

                const exporter = new THREE.STLExporter();
                const exportGroup = new THREE.Group();
                voxels.forEach(voxel => exportGroup.add(voxel.clone()));
                
                // Export as binary STL
                const result = exporter.parse( exportGroup, { binary: true } );
                
                const blob = new Blob( [ result ], { type: 'application/octet-stream' } );
                const link = document.createElement( 'a' );
                link.style.display = 'none';
                link.href = URL.createObjectURL( blob );
                link.download = 'webvoxel_model.stl';
                
                document.body.appendChild( link );
                link.click();
                document.body.removeChild( link );
                
                showToast("Model exported to .STL successfully!", "success");
            } catch (error) {
                console.error("Export failed:", error);
                showToast("Failed to export STL model.", "error");
            }
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            // Styling based on type
            let bgColor = type === 'success' ? 'bg-emerald-500' : (type === 'error' ? 'bg-red-500' : 'bg-indigo-500');
            let icon = type === 'success' ? 'ph-check-circle' : (type === 'error' ? 'ph-warning-circle' : 'ph-info');
            
            toast.className = `toast-animate flex items-center gap-3 px-5 py-3 rounded-xl text-white font-medium shadow-2xl shadow-black/50 ${bgColor}`;
            toast.innerHTML = `<i class="ph ${icon} text-xl"></i> ${message}`;
            
            container.appendChild(toast);
            
            // Remove after 3 seconds
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(100%)';
                toast.style.transition = 'all 0.3s ease-out';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function animate() {
            requestAnimationFrame( animate );
            controls.update(); // only required if controls.enableDamping = true
            renderer.render( scene, camera );
        }
    </script>
</body>
</html>
